<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alexander | Retro Pixel Portfolio</title>

    <!-- Fuente estilo Game Boy -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #98D8C8; /* Verde menta tipo Game Boy */
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            padding: 0;
            color: #2C2C2C;
        }

        .container {
            width: 90%;
            margin: auto;
            padding-top: 40px;
            text-align: center;
        }

        .panel {
            background-color: #F8F8F8;
            border: 4px solid #2C2C2C;
            padding: 20px;
            margin: auto;
            width: 85%;
            box-shadow: 0px 0px 0px 6px #2C2C2C;
        }

        .title {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .sprite {
            width: 120px;
            height: 120px;
            background-color: #C4C4C4;
            border: 4px solid #2C2C2C;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .buttons {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            margin: 10px;
            background-color: #FFCB05; /* Amarillo estilo Poké */
            color: #2C2C2C;
            text-decoration: none;
            border: 4px solid #2C2C2C;
            box-shadow: 0px 0px 0px 4px #2C2C2C;
        }

        .btn:hover {
            background-color: #2C2C2C;
            color: #FFCB05;
        }

        .dialog-box {
            background-color: #FFFFFF;
            border: 4px solid #2C2C2C;
            padding: 20px;
            margin-top: 30px;
            width: 85%;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0px 0px 0px 6px #2C2C2C;
            font-size: 14px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="panel">
            <div class="title">Bienvenido al Mundo Pixel</div>

            <div class="sprite">
                <!-- Aquí luego puedes poner tu avatar pixel art -->
                <span>Avatar</span>
            </div>

            <div class="dialog-box">
                ¡Hola! Soy <strong>Alexander</strong>.  
                Técnico TI, Redes, Ciberseguridad y Raspberry Pi.  
                Este es mi portafolio estilo Pixel Art inspirado en RPG retro.  
                Explora mis proyectos, certificaciones y aventuras tecnológicas.
            </div>

            <div class="buttons">
                <a class="btn" href="#">CV PDF</a>
                <a class="btn" href="#">LinkedIn</a>
                <a class="btn" href="#">GitHub</a>
                <a class="btn" href="#">Contacto</a>
            </div>
        </div>

    </div>

</body>
</html>
