<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portafolio de Alexander Watson: soporte TI, ciberseguridad y redes, en estilo pixel art.">
    <title>Alexander Watson | Portafolio pixel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css?v=6">
</head>
<body>

    <noscript><style>#page-wipe, #boot-screen { display: none; }</style></noscript>

    <!-- Cortina de transición hacia otras páginas -->
    <div id="page-wipe" aria-hidden="true">
        <span class="wipe-half wipe-top"></span>
        <span class="wipe-half wipe-bottom"></span>
    </div>

    <!-- Pantalla de encendido: solo aparece una vez por sesión -->
    <div id="boot-screen">
        <div class="boot-blocks" aria-hidden="true">
            <span class="blk blk-a"></span>
            <span class="blk blk-b"></span>
            <span class="blk blk-c"></span>
            <span class="blk blk-d"></span>
        </div>
        <p class="boot-name">ALEXANDER WATSON</p>
        <p class="boot-prompt">Pulsa START</p>
        <div class="boot-flash" aria-hidden="true"></div>
    </div>

    <!-- Efectos de sonido: agrega tus archivos en sfx/ y pon el src aquí -->
    <audio data-sfx="boot"    preload="auto"></audio>
    <audio data-sfx="confirm" preload="auto"></audio>
    <audio data-sfx="move"    preload="auto"></audio>
    <audio data-sfx="page"    preload="auto"></audio>

    <main class="scene">

        <img src="img/squirtle.gif"  alt="" class="pkm squirtle">
        <img src="img/vaporeon.gif"  alt="" class="pkm vaporeon">
        <img src="img/bulbasaur.gif" alt="" class="pkm bulbasaur">
        <img src="img/charmander.gif" alt="" class="pkm charmander">
        <img src="img/pikachu.gif"   alt="" class="pkm pikachu">
        <img src="img/milotic-f.gif" alt="" class="pkm milotic">

        <div class="dialog-box has-cursor">
            <p data-type>¡Hola! Soy Alexander Watson.</p>
            <p data-type>Soporte TI, redes y ciberseguridad. Me gusta dejar los sistemas funcionando y documentados.</p>
            <p data-type>Elige una opción para seguir.</p>
        </div>

        <nav class="menu-buttons" aria-label="Menú principal">
            <a href="about.html" class="btn">Sobre mí</a>
            <a href="projects.html" class="btn">Proyectos</a>
            <a href="certifications.html" class="btn">Certificaciones</a>
            <a href="contact.html" class="btn">Contacto</a>
        </nav>

        <p class="hint">Usa las flechas y Enter</p>

    </main>

    <script src="scripts/main.js?v=4"></script>
</body>
</html>
