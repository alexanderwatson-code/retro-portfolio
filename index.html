<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pokémon Menu</title>
<style>
  body {
    margin: 0;
    background: #f8f8f8;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }

  /* Contenedor principal */
  .menu-box {
    width: 320px;
    height: 240px;
    background: #ffffff;
    border: 4px solid #000;
    padding: 12px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Opciones estilo FireRed */
  .option {
    font-size: 14px;
    padding: 6px 0;
    display: flex;
    align-items: center;
  }

  /* Cursor tipo flecha Pokémon */
  .cursor {
    width: 12px;
    height: 12px;
    margin-right: 8px;
    background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAAPUlEQVQoz2NgQAN/Pz8z8P///wMxwMjIyPgPxGJgYGBg+A/EYmBgYGD4D8RiYGhgYH4D8RiYGBgYH4DAwMAAAAwGgX8pVORbAAAAABJRU5ErkJggg==') no-repeat;
    background-size: cover;
    visibility: hidden;
  }

  .selected .cursor {
    visibility: visible;
  }
</style>
</head>
<body>

<div class="menu-box">
  <div class="option selected"><div class="cursor"></div>INICIO</div>
  <div class="option"><div class="cursor"></div>PERFIL</div>
  <div class="option"><div class="cursor"></div>EXPERIENCIA</div>
  <div class="option"><div class="cursor"></div>CERTIFICACIONES</div>
  <div class="option"><div class="cursor"></div>PROYECTOS</div>
  <div class="option"><div class="cursor"></div>CONTACTO</div>
</div>

<script>
  let index = 0;
  const options = document.querySelectorAll('.option');

  function updateSelection() {
    options.forEach((opt, i) => {
      opt.classList.toggle('selected', i === index);
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      index = (index + 1) % options.length;
      updateSelection();
    }
    if (e.key === 'ArrowUp') {
      index = (index - 1 + options.length) % options.length;
      updateSelection();
    }
  });
</script>

</body>
</html>
